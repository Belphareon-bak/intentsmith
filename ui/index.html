<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.3 AI Agent</title>
  <style>
    :root { --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --text:#e6edf3; --text2:#8b949e; --accent:#58a6ff; --success:#3fb950; --warn:#d29922; --err:#f85149; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
    .app { display:flex; height:100vh; }
    .sidebar { width:240px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; }
    .sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
    .logo { font-size:24px; font-weight:700; color:var(--accent); }
    .nav { padding:8px; flex:1; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:6px; cursor:pointer; color:var(--text2); margin-bottom:2px; }
    .nav-item:hover { background:var(--bg3); color:var(--text); }
    .nav-item.active { background:var(--accent); color:#fff; }
    .main { flex:1; display:flex; flex-direction:column; }
    .header { height:50px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
    .status { display:flex; align-items:center; gap:8px; font-size:13px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
    .dot.busy { background:var(--warn); animation:pulse 1s infinite; }
    @keyframes pulse { 50% { opacity:.5 } }
    .messages { flex:1; overflow-y:auto; padding:20px; }
    .msg { max-width:75%; padding:12px 16px; border-radius:12px; margin-bottom:12px; line-height:1.5; }
    .msg.user { background:var(--accent); margin-left:auto; }
    .msg.bot { background:var(--bg3); }
    .msg.sys { background:transparent; border:1px solid var(--border); color:var(--text2); font-size:13px; text-align:center; max-width:100%; margin:0 auto 12px; }
    .msg pre { background:var(--bg); padding:10px; border-radius:6px; overflow-x:auto; margin:8px 0; font-size:12px; }
    .msg code { background:var(--bg); padding:2px 6px; border-radius:4px; font-size:12px; font-family:monospace; }
    .msg pre code { background:none; padding:0; }
    .msg strong { color:var(--accent); }
    .input-area { padding:16px; background:var(--bg2); }
    .input-wrap { display:flex; gap:10px; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:10px; }
    .input-wrap:focus-within { border-color:var(--accent); }
    .input-wrap textarea { flex:1; background:none; border:none; color:var(--text); font-size:14px; resize:none; outline:none; font-family:inherit; }
    .send-btn { background:var(--accent); border:none; border-radius:6px; color:#fff; padding:8px 16px; cursor:pointer; font-weight:500; }
    .send-btn:hover { background:#79c0ff; }
    .send-btn:disabled { background:var(--bg3); color:var(--text2); }
    .progress { padding:12px 20px; background:var(--bg2); border-top:1px solid var(--border); display:none; }
    .progress-bar { height:4px; background:var(--bg3); border-radius:2px; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--success)); border-radius:2px; transition:width .3s; }
    .progress-text { display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--text2); }
    .stats { height:24px; background:var(--bg3); border-top:1px solid var(--border); display:flex; align-items:center; padding:0 16px; font-size:11px; color:var(--text2); gap:20px; }
    .settings { width:280px; background:var(--bg2); border-left:1px solid var(--border); padding:16px; display:none; }
    .settings.open { display:block; }
    .settings h3 { font-size:11px; text-transform:uppercase; color:var(--text2); margin:16px 0 8px; }
    .setting { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
    .toggle { width:40px; height:22px; background:var(--bg3); border-radius:11px; position:relative; cursor:pointer; }
    .toggle.on { background:var(--accent); }
    .toggle::after { content:''; position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:2px; left:2px; transition:transform .2s; }
    .toggle.on::after { transform:translateX(18px); }
    .toast-box { position:fixed; bottom:20px; right:20px; z-index:999; }
    .toast { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-top:8px; animation:slideIn .3s; }
    @keyframes slideIn { from { opacity:0; transform:translateX(50px) } }
    .toast.ok { border-left:3px solid var(--success); }
    .toast.err { border-left:3px solid var(--err); }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><span class="logo">C.3</span> <small style="color:var(--text2)">Agent</small></div>
    <nav class="nav">
      <div class="nav-item active">💬 New Chat</div>
      <div class="nav-item">🔍 Search</div>
      <div class="nav-item">🤖 Agents</div>
      <div class="nav-item">📁 Projects</div>
      <div class="nav-item">📜 History</div>
    </nav>
  </aside>
  <main class="main">
    <header class="header">
      <select id="project" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text);font-size:13px;">
        <option>default-project</option>
      </select>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting...</span>
        <button onclick="document.querySelector('.settings').classList.toggle('open')" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;margin-left:12px;">⚙️</button>
      </div>
    </header>
    <div class="messages" id="msgs">
      <div class="msg sys">Welcome to C.3 AI Agent. Describe what you want to build.</div>
    </div>
    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="pFill" style="width:0%"></div></div>
      <div class="progress-text"><span id="pStep">Step 0/0</span><span id="pPct">0%</span></div>
    </div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" placeholder="Describe your task..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
      </div>
    </div>
    <div class="stats">
      <span>CPU: <b id="cpu">--</b></span>
      <span>RAM: <b id="ram">--</b></span>
      <span>Tools: <b id="tools">--</b></span>
      <span id="conn">Offline</span>
    </div>
  </main>
  <aside class="settings">
    <b>Settings</b>
    <h3>Appearance</h3>
    <div class="setting"><span>Dark Mode</span><div class="toggle on"></div></div>
    <h3>Agent</h3>
    <div class="setting"><span>Auto-approve safe</span><div class="toggle"></div></div>
    <div class="setting"><span>Show thinking</span><div class="toggle on"></div></div>
  </aside>
</div>
<div class="toast-box" id="toasts"></div>
<script>
const API = 'http://127.0.0.1:3335';
let sse = null;

function addMsg(type, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  // Basic markdown rendering
  let html = text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  d.innerHTML = html;
  document.getElementById('msgs').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function toast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function setStatus(status, busy=false) {
  document.getElementById('statusText').textContent = status;
  document.getElementById('dot').className = 'dot' + (busy ? ' busy' : '');
}

function showProgress(step, total) {
  const el = document.getElementById('progress');
  el.style.display = 'block';
  const pct = Math.round((step/total)*100);
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pStep').textContent = `Step ${step}/${total}`;
  document.getElementById('pPct').textContent = pct + '%';
}

function hideProgress() {
  document.getElementById('progress').style.display = 'none';
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  addMsg('user', text);
  setStatus('Processing...', true);
  
  try {
    const res = await fetch(API + '/agent/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task: text})
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    toast('Task started');
  } catch(e) {
    addMsg('sys', 'Error: ' + e.message);
    setStatus('Error', false);
    toast(e.message, 'err');
  }
}

function connectSSE() {
  if (sse) sse.close();
  sse = new EventSource(API + '/stream');
  
  sse.onopen = () => {
    setStatus('Ready');
    document.getElementById('conn').textContent = 'Connected';
    document.getElementById('conn').style.color = '#3fb950';
  };
  
  sse.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      handleEvent(data);
    } catch {}
  };
  
  sse.onerror = () => {
    setStatus('Disconnected');
    document.getElementById('conn').textContent = 'Offline';
    document.getElementById('conn').style.color = '#f85149';
    setTimeout(connectSSE, 3000);
  };
}

function handleEvent(ev) {
  console.log('Event:', ev);
  switch(ev.type) {
    case 'agent_start': 
      setStatus('Working...', true); 
      break;
    case 'agent_thought': 
      // Show full analysis, not just summary
      const thought = ev.thought;
      let msg = thought?.analysis || thought?.summary || '';
      if (thought?.progress && thought.progress !== 'Unknown') {
        msg += '\n\n📊 ' + thought.progress;
      }
      if (msg) addMsg('bot', msg);
      break;
    case 'agent_action_planned':
      addMsg('bot', '🔧 Using tool: **' + ev.action?.tool + '**' + 
        (ev.action?.reason ? ' - ' + ev.action.reason : ''));
      break;
    case 'agent_action_result': 
      if (ev.result?.success) {
        let output = '✅ **' + ev.action?.tool + '** completed';
        // Show actual result data
        if (ev.result?.result) {
          const r = ev.result.result;
          if (r.content) output += '\n\n```\n' + r.content.substring(0, 500) + '\n```';
          else if (r.entries) output += '\n\nFound ' + r.entries.length + ' items';
          else if (r.stdout) output += '\n\n```\n' + r.stdout.substring(0, 500) + '\n```';
          else if (typeof r === 'string') output += '\n\n' + r.substring(0, 500);
        }
        addMsg('bot', output);
      } else {
        const errMsg = ev.result?.error || ev.result?.stderr || 'Unknown error';
        addMsg('bot', '❌ **' + ev.action?.tool + '** failed:\n' + errMsg);
      }
      break;
    case 'agent_complete': 
      let completeMsg = '🎉 **Task completed!**';
      if (ev.result) {
        completeMsg += '\n\n' + (typeof ev.result === 'string' ? ev.result : JSON.stringify(ev.result, null, 2));
      }
      addMsg('bot', completeMsg); 
      setStatus('Ready'); 
      hideProgress();
      toast('Task completed!');
      break;
    case 'agent_error': 
      addMsg('sys', '❌ **Error:** ' + ev.error); 
      setStatus('Ready'); 
      hideProgress();
      toast(ev.error, 'err');
      break;
    case 'agent_max_iterations':
      addMsg('sys', '⚠️ Reached maximum iterations (' + ev.iteration + '). Task may be incomplete.');
      setStatus('Ready');
      hideProgress();
      break;
    case 'step_start': showProgress(ev.stepIndex || 0, ev.totalSteps || 1); break;
    case 'execution_done': setStatus('Ready'); hideProgress(); break;
  }
}

async function loadStats() {
  try {
    const res = await fetch(API + '/status');
    const data = await res.json();
    document.getElementById('tools').textContent = data.tools || '--';
  } catch {}
  
  try {
    const res = await fetch(API + '/agent/tool', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({tool: 'system:resources'})
    });
    const data = await res.json();
    if (data.result) {
      document.getElementById('cpu').textContent = (data.result.cpu?.loadPercent || '--') + '%';
      document.getElementById('ram').textContent = (data.result.memory?.usedPercent || '--') + '%';
    }
  } catch {}
}

async function loadProjects() {
  try {
    const res = await fetch(API + '/projects');
    const data = await res.json();
    const sel = document.getElementById('project');
    sel.innerHTML = '';
    (data.projects || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      if (p === data.active) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch {}
}

// Init
connectSSE();
loadStats();
loadProjects();
setInterval(loadStats, 10000);

document.querySelectorAll('.toggle').forEach(t => t.onclick = () => t.classList.toggle('on'));
</script>
</body>
</html>
