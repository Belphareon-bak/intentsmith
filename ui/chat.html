<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.3 AI Assistant</title>
  <style>
    :root { --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --text:#e6edf3; --text2:#8b949e; --accent:#58a6ff; --success:#3fb950; --warn:#d29922; --err:#f85149; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; }
    
    /* Sidebar */
    .sidebar { width:260px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; }
    .sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
    .sidebar-header h1 { font-size:18px; font-weight:600; }
    .sidebar-header h1 span { color:var(--accent); }
    
    .sidebar-nav { padding:12px; }
    .nav-btn { width:100%; padding:10px 12px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .nav-btn:hover { background:#79c0ff; }
    .nav-btn.secondary { background:transparent; border:1px solid var(--border); color:var(--text2); }
    .nav-btn.secondary:hover { background:var(--bg3); color:var(--text); }
    
    .search-box { width:100%; padding:8px 12px; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; margin-bottom:12px; }
    .search-box:focus { outline:none; border-color:var(--accent); }
    
    .history-section { flex:1; overflow-y:auto; padding:0 12px 12px; }
    .history-section h3 { font-size:11px; text-transform:uppercase; color:var(--text2); margin:12px 0 8px; }
    .history-item { padding:10px 12px; background:var(--bg3); border-radius:6px; margin-bottom:6px; cursor:pointer; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-item:hover { background:var(--border); }
    .history-item.active { border-left:3px solid var(--accent); }
    .history-item .time { font-size:11px; color:var(--text2); }
    
    /* Main area */
    .main { flex:1; display:flex; flex-direction:column; }
    
    .header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
    .header-left { display:flex; align-items:center; gap:12px; }
    .workdir-input { padding:6px 10px; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; width:280px; }
    .workdir-input:focus { outline:none; border-color:var(--accent); }
    .status { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text2); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
    .dot.thinking { background:var(--warn); animation:pulse 1s infinite; }
    @keyframes pulse { 50% { opacity:.4 } }
    
    .chat { flex:1; overflow-y:auto; padding:24px; max-width:900px; margin:0 auto; width:100%; }
    
    .message { margin-bottom:24px; animation:fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px) } }
    
    .message.user { display:flex; justify-content:flex-end; }
    .message.user .bubble { background:var(--accent); color:#fff; border-radius:18px 18px 4px 18px; }
    .message.assistant .bubble { background:var(--bg2); border:1px solid var(--border); border-radius:4px 18px 18px 18px; }
    
    .bubble { max-width:75%; padding:12px 18px; line-height:1.6; }
    .bubble pre { background:var(--bg); padding:12px; border-radius:8px; overflow-x:auto; margin:12px 0; font-size:13px; font-family:'Fira Code',monospace; }
    .bubble code { background:var(--bg3); padding:2px 6px; border-radius:4px; font-size:13px; font-family:'Fira Code',monospace; }
    .bubble pre code { background:none; padding:0; }
    .bubble strong { color:var(--accent); }
    .bubble ul, .bubble ol { margin:8px 0 8px 20px; }
    .bubble li { margin:4px 0; }
    .bubble a { color:var(--accent); }
    .bubble p { margin:8px 0; }
    .bubble p:first-child { margin-top:0; }
    .bubble p:last-child { margin-bottom:0; }
    
    .typing { display:flex; gap:4px; padding:8px 0; }
    .typing span { width:8px; height:8px; background:var(--text2); border-radius:50%; animation:bounce .6s infinite; }
    .typing span:nth-child(2) { animation-delay:.1s; }
    .typing span:nth-child(3) { animation-delay:.2s; }
    @keyframes bounce { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
    
    .input-area { background:var(--bg2); border-top:1px solid var(--border); padding:16px 24px; }
    .input-container { max-width:900px; margin:0 auto; display:flex; gap:12px; }
    .input-wrap { flex:1; display:flex; background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:12px 16px; }
    .input-wrap:focus-within { border-color:var(--accent); }
    .input-wrap textarea { flex:1; background:none; border:none; color:var(--text); font-size:15px; resize:none; outline:none; font-family:inherit; line-height:1.5; max-height:150px; }
    .input-wrap textarea::placeholder { color:var(--text2); }
    
    .send-btn { background:var(--accent); border:none; border-radius:10px; color:#fff; padding:12px 24px; cursor:pointer; font-size:15px; font-weight:500; transition:all .2s; }
    .send-btn:hover { background:#79c0ff; }
    .send-btn:disabled { background:var(--bg3); color:var(--text2); cursor:not-allowed; }
    
    .welcome { text-align:center; padding:60px 20px; color:var(--text2); }
    .welcome h2 { color:var(--text); margin-bottom:12px; font-size:24px; }
    .welcome p { max-width:500px; margin:0 auto 24px; line-height:1.6; }
    .examples { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:600px; margin:0 auto; }
    .example { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:10px 16px; cursor:pointer; transition:all .2s; font-size:14px; }
    .example:hover { border-color:var(--accent); background:var(--bg3); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1><span>C.3</span> Agent</h1>
    </div>
    <div class="sidebar-nav">
      <button class="nav-btn" onclick="newChat()">💬 New Chat</button>
      <input type="text" class="search-box" placeholder="🔍 Search chats..." oninput="searchHistory(this.value)">
    </div>
    <div class="history-section">
      <h3>📜 History</h3>
      <div id="historyList"></div>
    </div>
  </aside>
  
  <main class="main">
    <header class="header">
      <div class="header-left">
        <span style="color:var(--text2)">Working dir:</span>
        <input type="text" class="workdir-input" id="workdir" placeholder="/home/user/projects">
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>
    
    <div class="chat" id="chat">
      <div class="welcome">
        <h2>Hello! I'm C.3</h2>
        <p>I'm an AI assistant that can help you with coding, file management, web searches, and more. I'll ask clarifying questions when needed.</p>
        <div class="examples">
          <div class="example" onclick="setInput('Create a Kubernetes PVC manifest')">Create K8s PVC</div>
          <div class="example" onclick="setInput('Find cheaper alternatives for a car on sauto.cz')">Search car prices</div>
          <div class="example" onclick="setInput('Create a simple Express.js server')">Create web server</div>
          <div class="example" onclick="setInput('What files are in my current directory?')">List files</div>
        </div>
      </div>
    </div>
    
    <div class="input-area">
      <div class="input-container">
        <div class="input-wrap">
          <textarea id="input" placeholder="Ask me anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
      </div>
    </div>
  </main>

<script>
const API = 'http://127.0.0.1:3335';
let isThinking = false;
let currentChatId = null;
let chats = {};

// Load chats from localStorage
function loadChats() {
  const saved = localStorage.getItem('c3_chats');
  if (saved) {
    chats = JSON.parse(saved);
  }
  renderHistory();
}

// Save chats to localStorage
function saveChats() {
  localStorage.setItem('c3_chats', JSON.stringify(chats));
  renderHistory();
}

// Generate chat ID
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

// Get current chat
function getCurrentChat() {
  if (!currentChatId || !chats[currentChatId]) {
    currentChatId = genId();
    chats[currentChatId] = {
      id: currentChatId,
      title: 'New Chat',
      messages: [],
      created: Date.now(),
      updated: Date.now()
    };
  }
  return chats[currentChatId];
}

// New chat
function newChat() {
  // Save current if has messages
  if (currentChatId && chats[currentChatId]?.messages.length > 0) {
    saveChats();
  }
  
  currentChatId = genId();
  chats[currentChatId] = {
    id: currentChatId,
    title: 'New Chat',
    messages: [],
    created: Date.now(),
    updated: Date.now()
  };
  
  // Reset UI
  document.getElementById('chat').innerHTML = `
    <div class="welcome">
      <h2>Hello! I'm C.3</h2>
      <p>I'm an AI assistant that can help you with coding, file management, web searches, and more.</p>
      <div class="examples">
        <div class="example" onclick="setInput('Create a Kubernetes PVC manifest')">Create K8s PVC</div>
        <div class="example" onclick="setInput('Find cars on sauto.cz')">Search cars</div>
        <div class="example" onclick="setInput('Create Express.js server')">Create server</div>
        <div class="example" onclick="setInput('List files in current directory')">List files</div>
      </div>
    </div>
  `;
  
  // Reset server session
  fetch(API + '/chat/reset', { method: 'POST' });
  
  renderHistory();
}

// Load chat from history
function loadChat(chatId) {
  if (!chats[chatId]) return;
  
  currentChatId = chatId;
  const chat = chats[chatId];
  
  // Render messages
  const chatEl = document.getElementById('chat');
  chatEl.innerHTML = '';
  
  for (const msg of chat.messages) {
    addMessageToDOM(msg.role, msg.content);
  }
  
  renderHistory();
}

// Render history list
function renderHistory() {
  const list = document.getElementById('historyList');
  const sorted = Object.values(chats)
    .filter(c => c.messages.length > 0)
    .sort((a, b) => b.updated - a.updated);
  
  list.innerHTML = sorted.map(chat => {
    const isActive = chat.id === currentChatId ? 'active' : '';
    const time = new Date(chat.updated).toLocaleDateString();
    return `
      <div class="history-item ${isActive}" onclick="loadChat('${chat.id}')">
        ${chat.title}
        <div class="time">${time}</div>
      </div>
    `;
  }).join('');
}

// Search history
function searchHistory(query) {
  const list = document.getElementById('historyList');
  const q = query.toLowerCase();
  
  const filtered = Object.values(chats)
    .filter(c => c.messages.length > 0)
    .filter(c => {
      if (!q) return true;
      if (c.title.toLowerCase().includes(q)) return true;
      return c.messages.some(m => m.content.toLowerCase().includes(q));
    })
    .sort((a, b) => b.updated - a.updated);
  
  list.innerHTML = filtered.map(chat => {
    const isActive = chat.id === currentChatId ? 'active' : '';
    const time = new Date(chat.updated).toLocaleDateString();
    return `
      <div class="history-item ${isActive}" onclick="loadChat('${chat.id}')">
        ${chat.title}
        <div class="time">${time}</div>
      </div>
    `;
  }).join('');
}

function setStatus(text, thinking = false) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'dot' + (thinking ? ' thinking' : '');
  isThinking = thinking;
  document.getElementById('sendBtn').disabled = thinking;
}

function addMessageToDOM(role, content) {
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();
  
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'message ' + role;
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatContent(content);
  
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  
  return msg;
}

function addMessage(role, content) {
  addMessageToDOM(role, content);
  
  // Save to current chat
  const chat = getCurrentChat();
  chat.messages.push({ role, content, time: Date.now() });
  chat.updated = Date.now();
  
  // Update title from first user message
  if (role === 'user' && chat.messages.filter(m => m.role === 'user').length === 1) {
    chat.title = content.substring(0, 40) + (content.length > 40 ? '...' : '');
  }
  
  saveChats();
}

function addTypingIndicator() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'message assistant';
  msg.id = 'typing';
  msg.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTypingIndicator() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function formatContent(text) {
  return text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^(.+)$/s, '<p>$1</p>')
    .replace(/<p><\/p>/g, '')
    .replace(/<p>(<pre>)/g, '$1')
    .replace(/(<\/pre>)<\/p>/g, '$1');
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function setInput(text) {
  document.getElementById('input').value = text;
  document.getElementById('input').focus();
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isThinking) return;
  
  input.value = '';
  input.style.height = 'auto';
  
  addMessage('user', text);
  addTypingIndicator();
  setStatus('Thinking...', true);
  
  try {
    const workdir = document.getElementById('workdir').value || undefined;
    
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, workdir, sessionId: currentChatId })
    });
    
    const data = await res.json();
    removeTypingIndicator();
    
    if (data.error) {
      addMessage('assistant', '❌ Error: ' + data.error);
    } else {
      addMessage('assistant', data.response);
    }
    
    setStatus('Ready');
    
  } catch (e) {
    removeTypingIndicator();
    addMessage('assistant', '❌ Connection error: ' + e.message);
    setStatus('Error');
  }
}

// Init
loadChats();
fetch(API + '/health')
  .then(r => r.json())
  .then(() => setStatus('Ready'))
  .catch(() => setStatus('Offline'));
</script>
</body>
</html>
