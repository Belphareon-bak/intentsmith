<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Assistant</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --text-color: #ecf0f1;
            --background-color: #2c3e50;
            --font-family: 'Arial', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
        }

        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            width: 250px;
            background-color: var(--secondary-color);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
        }

        #main-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header, .chat-footer {
            background-color: var(--secondary-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: var(--primary-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 10px;
        }

        .message.user {
            text-align: right;
        }

        .message.bot {
            text-align: left;
        }

        .code-block {
            position: relative;
            background-color: #272822;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
        }

        .code-block button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .code-block button:hover {
            background-color: #2980b9;
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-tree, .session-list {
            margin-bottom: 20px;
        }

        .file-tree ul, .session-list ul {
            list-style-type: none;
            padding-left: 0;
        }

        .file-tree li, .session-list li {
            margin-bottom: 5px;
            cursor: pointer;
        }

        .file-tree li:hover, .session-list li:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            #sidebar {
                transform: translateX(-100%);
            }

            #sidebar.visible {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar" class="hidden">
            <div class="session-list">
                <button id="new-chat-btn">New Chat</button>
                <ul>
                    <li>Session 1</li>
                    <li>Session 2</li>
                </ul>
            </div>
            <div class="file-tree">
                <h3>Generated Files</h3>
                <ul>
                    <li>file1.txt</li>
                    <li>file2.py</li>
                </ul>
            </div>
        </div>
        <div id="main-content">
            <div class="chat-header">
                <h2>Chat with AI Coding Assistant</h2>
                <button id="toggle-sidebar-btn">☰</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-footer">
                <textarea id="user-input" placeholder="Type your message here..."></textarea>
                <button id="send-btn">Send</button>
                <div id="loading-spinner" class="loading-spinner" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlightjs@11.7.0/lib/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlightjs@11.7.0/styles/default.min.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
            const sendBtn = document.getElementById('send-btn');
            const userInput = document.getElementById('user-input');
            const chatMessages = document.getElementById('chat-messages');
            const loadingSpinner = document.getElementById('loading-spinner');

            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('visible');
            });

            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                userInput.value = '';
                loadingSpinner.style.display = 'inline-block';
                sendBtn.disabled = true;

                const sessionId = 'session1'; // Replace with actual session ID
                const workdir = '/path/to/workdir'; // Replace with actual work directory

                fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message, sessionId, workdir })
                })
                .then(response => response.json())
                .then(data => {
                    renderMessage(message, 'user');
                    renderMessage(data.response, 'bot');
                })
                .catch(error => {
                    console.error('Error:', error);
                    renderMessage('An error occurred. Please try again.', 'bot');
                })
                .finally(() => {
                    loadingSpinner.style.display = 'none';
                    sendBtn.disabled = false;
                });
            }

            function renderMessage(message, type) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message', type);

                const parsedMessage = marked.parse(message);
                messageElement.innerHTML = parsedMessage;

                const codeBlocks = messageElement.querySelectorAll('pre code');
                codeBlocks.forEach(block => {
                    hljs.highlightBlock(block);

                    const copyButton = document.createElement('button');
                    copyButton.textContent = 'Copy';
                    copyButton.addEventListener('click', () => {
                        navigator.clipboard.writeText(block.innerText);
                    });
                    block.parentElement.appendChild(copyButton);
                });

                chatMessages.appendChild(messageElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });
    </script>
</body>
</html>
