<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.3 Expertises - Mistři v oboru</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --bg-hover: #2a2a2a;
      --border-color: #333;
      --text-primary: #e5e5e5;
      --text-secondary: #888;
      --accent: #7c3aed;
      --accent-hover: #8b5cf6;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Main Layout */
    .main-content {
      display: flex;
      height: calc(100vh - 65px);
    }

    /* Sidebar - Categories */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .category-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-item:hover {
      background: var(--bg-tertiary);
    }

    .category-item.active {
      background: var(--accent);
      color: white;
    }

    .category-icon {
      font-size: 1.2rem;
    }

    .category-name {
      flex: 1;
    }

    .category-count {
      background: var(--bg-tertiary);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .category-item.active .category-count {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    /* Expertise Grid */
    .content-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .content-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .expertise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .expertise-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .expertise-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .expertise-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.3);
    }

    .expertise-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .expertise-icon {
      font-size: 2.5rem;
      line-height: 1;
    }

    .expertise-info {
      flex: 1;
    }

    .expertise-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .expertise-domain {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .expertise-description {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .expertise-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .expertise-tag {
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .expertise-tag.creative { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .expertise-tag.analytical { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .expertise-tag.conservative { background: rgba(234, 179, 8, 0.2); color: #fbbf24; }

    /* Detail Panel */
    .detail-panel {
      width: 400px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      padding: 24px;
      overflow-y: auto;
      display: none;
    }

    .detail-panel.visible {
      display: block;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .detail-icon {
      font-size: 3rem;
    }

    .detail-title h3 {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }

    .detail-title p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-secondary);
    }

    .detail-value {
      font-weight: 500;
    }

    .detail-prompt {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      flex: 1;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
    }

    .btn-chat {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      flex: 1;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-chat:hover {
      background: var(--accent-hover);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border-radius: 12px;
      width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.5rem;
      padding: 0;
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Custom badge */
    .custom-badge {
      background: rgba(124, 58, 237, 0.2);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/architect" class="back-link">
        ← Zpět na chat
      </a>
      <h1>🎓 Expertyzy</h1>
    </div>
    <button class="btn-primary" onclick="openCreateModal()">
      + Vytvořit expertyzu
    </button>
  </header>

  <div class="main-content">
    <!-- Sidebar - Categories -->
    <aside class="sidebar">
      <h2>Kategorie</h2>
      <div id="categories"></div>
    </aside>

    <!-- Expertise Grid -->
    <main class="content-area">
      <div class="content-header">
        <h2 id="content-title">Všechny expertyzy</h2>
      </div>
      <div class="expertise-grid" id="expertise-grid"></div>
    </main>

    <!-- Detail Panel -->
    <aside class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <span class="detail-icon" id="detail-icon">✍️</span>
        <div class="detail-title">
          <h3 id="detail-name">Spisovatel</h3>
          <p id="detail-domain">creative_writing</p>
        </div>
      </div>

      <div class="detail-section">
        <h4>Nastavení</h4>
        <div class="detail-row">
          <span class="detail-label">Plánování</span>
          <span class="detail-value" id="detail-planning">deep</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Revize</span>
          <span class="detail-value" id="detail-review">iterative</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Data</span>
          <span class="detail-value" id="detail-data">forbidden</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Styl</span>
          <span class="detail-value" id="detail-bias">creative</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Teplota</span>
          <span class="detail-value" id="detail-temp">0.8</span>
        </div>
      </div>

      <div class="detail-section">
        <h4>System Prompt</h4>
        <div class="detail-prompt" id="detail-prompt"></div>
      </div>

      <div class="detail-actions">
        <button class="btn-secondary" id="btn-edit" onclick="editExpertise()">Upravit</button>
        <button class="btn-chat" onclick="startChat()">💬 Zahájit chat</button>
      </div>
    </aside>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Vytvořit expertyzu</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label>Jméno</label>
            <input type="text" id="expertise-name" placeholder="Např. Spisovatel">
          </div>
          <div class="form-group">
            <label>Ikona (emoji)</label>
            <input type="text" id="expertise-icon" placeholder="✍️" maxlength="4">
          </div>
        </div>
        
        <div class="form-group">
          <label>Doména</label>
          <input type="text" id="expertise-domain" placeholder="Např. creative_writing">
        </div>

        <div class="form-group">
          <label>Popis</label>
          <input type="text" id="expertise-description" placeholder="Krátký popis co expertyza umí">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Plánování</label>
            <select id="expertise-planning">
              <option value="none">Žádné</option>
              <option value="light">Lehké</option>
              <option value="deep">Hluboké</option>
            </select>
          </div>
          <div class="form-group">
            <label>Revize</label>
            <select id="expertise-review">
              <option value="none">Žádná</option>
              <option value="self">Samo-revize</option>
              <option value="iterative">Iterativní</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Použití dat</label>
            <select id="expertise-data">
              <option value="forbidden">Zakázáno</option>
              <option value="evidence">Jako důkaz</option>
              <option value="controlled">Řízené</option>
            </select>
          </div>
          <div class="form-group">
            <label>Styl výstupu</label>
            <select id="expertise-bias">
              <option value="creative">Kreativní</option>
              <option value="analytical">Analytický</option>
              <option value="conservative">Konzervativní</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Teplota (0.0 - 1.0)</label>
          <input type="number" id="expertise-temp" value="0.5" min="0" max="1" step="0.1">
        </div>

        <div class="form-group">
          <label>System Prompt</label>
          <textarea id="expertise-prompt" placeholder="Instrukce pro expertyzu..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Zrušit</button>
        <button class="btn-primary" onclick="saveExpertise()">Uložit</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let expertises = [];
    let categories = [];
    let selectedExpertise = null;
    let selectedCategory = 'all';
    let editingExpertiseId = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadExpertises();
    });

    async function loadExpertises() {
      try {
        const response = await fetch('/api/expertises');
        const data = await response.json();
        expertises = data.expertises || [];
        categories = data.categories || [];
        renderCategories();
        renderExpertises();
      } catch (err) {
        console.error('Failed to load expertises:', err);
      }
    }

    function renderCategories() {
      const container = document.getElementById('categories');

      // All expertises
      let html = `
        <div class="category-item ${selectedCategory === 'all' ? 'active' : ''}"
             onclick="selectCategory('all')">
          <span class="category-icon">📚</span>
          <span class="category-name">Všechny</span>
          <span class="category-count">${expertises.length}</span>
        </div>
      `;

      // Built-in categories
      categories.forEach(cat => {
        const count = cat.id === 'custom'
          ? expertises.filter(e => e.isCustom).length
          : cat.expertises.filter(id => expertises.find(e => e.id === id)).length;
        
        html += `
          <div class="category-item ${selectedCategory === cat.id ? 'active' : ''}" 
               onclick="selectCategory('${cat.id}')">
            <span class="category-icon">${cat.icon}</span>
            <span class="category-name">${cat.name}</span>
            <span class="category-count">${count}</span>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectCategory(catId) {
      selectedCategory = catId;
      renderCategories();
      renderExpertises();

      const cat = categories.find(c => c.id === catId);
      document.getElementById('content-title').textContent =
        catId === 'all' ? 'Všechny expertyzy' : (cat?.name || catId);
    }

    function renderExpertises() {
      const container = document.getElementById('expertise-grid');

      let filtered = expertises;
      if (selectedCategory !== 'all') {
        const cat = categories.find(c => c.id === selectedCategory);
        if (cat) {
          if (cat.id === 'custom') {
            filtered = expertises.filter(e => e.isCustom);
          } else {
            filtered = expertises.filter(e => cat.expertises.includes(e.id));
          }
        }
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🎓</div>
            <p>Žádné expertyzy v této kategorii</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(expertise => `
        <div class="expertise-card ${selectedExpertise?.id === expertise.id ? 'selected' : ''}"
             onclick="selectExpertise('${expertise.id}')">
          <div class="expertise-header">
            <span class="expertise-icon">${expertise.icon}</span>
            <div class="expertise-info">
              <div class="expertise-name">
                ${expertise.name}
                ${expertise.isCustom ? '<span class="custom-badge">Custom</span>' : ''}
              </div>
              <div class="expertise-domain">${expertise.domain}</div>
            </div>
          </div>
          <p class="expertise-description">${expertise.description}</p>
          <div class="expertise-tags">
            <span class="expertise-tag ${expertise.outputBias}">${expertise.outputBias}</span>
            <span class="expertise-tag">${expertise.planningDepth} planning</span>
            <span class="expertise-tag">temp: ${expertise.temperature}</span>
          </div>
        </div>
      `).join('');
    }

    function selectExpertise(id) {
      selectedExpertise = expertises.find(e => e.id === id);
      if (!selectedExpertise) return;

      renderExpertises();
      showDetailPanel();
    }

    function showDetailPanel() {
      const panel = document.getElementById('detail-panel');
      panel.classList.add('visible');

      document.getElementById('detail-icon').textContent = selectedExpertise.icon;
      document.getElementById('detail-name').textContent = selectedExpertise.name;
      document.getElementById('detail-domain').textContent = selectedExpertise.domain;
      document.getElementById('detail-planning').textContent = selectedExpertise.planningDepth;
      document.getElementById('detail-review').textContent = selectedExpertise.reviewPolicy;
      document.getElementById('detail-data').textContent = selectedExpertise.dataUsagePolicy;
      document.getElementById('detail-bias').textContent = selectedExpertise.outputBias;
      document.getElementById('detail-temp').textContent = selectedExpertise.temperature;
      document.getElementById('detail-prompt').textContent = selectedExpertise.systemPrompt;

      // Show/hide edit button for custom expertises
      document.getElementById('btn-edit').style.display =
        selectedExpertise.isCustom ? 'block' : 'none';
    }

    function startChat() {
      if (!selectedExpertise) return;
      // Redirect to architect with expertise context
      window.location.href = `/architect?expertise=${selectedExpertise.id}`;
    }

    function openCreateModal() {
      editingExpertiseId = null;
      document.getElementById('modal-title').textContent = 'Vytvořit expertyzu';
      clearForm();
      document.getElementById('modal-overlay').classList.add('visible');
    }

    function editExpertise() {
      if (!selectedExpertise || !selectedExpertise.isCustom) return;

      editingExpertiseId = selectedExpertise.id;
      document.getElementById('modal-title').textContent = 'Upravit expertyzu';

      document.getElementById('expertise-name').value = selectedExpertise.name;
      document.getElementById('expertise-icon').value = selectedExpertise.icon;
      document.getElementById('expertise-domain').value = selectedExpertise.domain;
      document.getElementById('expertise-description').value = selectedExpertise.description;
      document.getElementById('expertise-planning').value = selectedExpertise.planningDepth;
      document.getElementById('expertise-review').value = selectedExpertise.reviewPolicy;
      document.getElementById('expertise-data').value = selectedExpertise.dataUsagePolicy;
      document.getElementById('expertise-bias').value = selectedExpertise.outputBias;
      document.getElementById('expertise-temp').value = selectedExpertise.temperature;
      document.getElementById('expertise-prompt').value = selectedExpertise.systemPrompt;

      document.getElementById('modal-overlay').classList.add('visible');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('visible');
      clearForm();
    }

    function clearForm() {
      document.getElementById('expertise-name').value = '';
      document.getElementById('expertise-icon').value = '';
      document.getElementById('expertise-domain').value = '';
      document.getElementById('expertise-description').value = '';
      document.getElementById('expertise-planning').value = 'none';
      document.getElementById('expertise-review').value = 'none';
      document.getElementById('expertise-data').value = 'forbidden';
      document.getElementById('expertise-bias').value = 'analytical';
      document.getElementById('expertise-temp').value = '0.5';
      document.getElementById('expertise-prompt').value = '';
    }

    async function saveExpertise() {
      const expertise = {
        name: document.getElementById('expertise-name').value,
        icon: document.getElementById('expertise-icon').value || '👤',
        domain: document.getElementById('expertise-domain').value,
        description: document.getElementById('expertise-description').value,
        planningDepth: document.getElementById('expertise-planning').value,
        reviewPolicy: document.getElementById('expertise-review').value,
        dataUsagePolicy: document.getElementById('expertise-data').value,
        outputBias: document.getElementById('expertise-bias').value,
        temperature: parseFloat(document.getElementById('expertise-temp').value),
        systemPrompt: document.getElementById('expertise-prompt').value
      };

      if (!expertise.name) {
        alert('Jméno je povinné');
        return;
      }

      try {
        const url = editingExpertiseId
          ? `/api/expertises/${editingExpertiseId}`
          : '/api/expertises';

        const method = editingExpertiseId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(expertise)
        });

        if (response.ok) {
          closeModal();
          loadExpertises();
        } else {
          const error = await response.json();
          alert(error.error || 'Chyba při ukládání');
        }
      } catch (err) {
        console.error('Save failed:', err);
        alert('Chyba při ukládání');
      }
    }

    // Close modal on overlay click
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    });
  </script>
</body>
</html>
