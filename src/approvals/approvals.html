<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approvaly — IntentSmith</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Rozhodovací plocha na desktopu (P0-6).

   Doteď se odsud rozhodovalo curlem: routa existovala, rozhraní ne. Tahle
   stránka je to rozhraní a je psaná podle téhož pravidla jako mobilní
   obrazovky — "nic nečeká" je povolení odložit to a smí ho dát jen potvrzená
   odpověď serveru, nikdy selhání.
   ══════════════════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f5f7; --surface: #ffffff; --border: #e0e0e6;
  --text: #1a1a2e; --text-muted: #8888a0; --text-light: #b0b0c0;
  --accent: #4a6fa5; --accent-hover: #3a5f95;
  --green: #2d9a5c; --green-bg: #eaf7f0;
  --amber: #a06a10; --amber-bg: #fdf4e3;
  --error: #d44; --error-bg: #fdeaea;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  min-height: 100vh; padding: 24px;
}
.wrap { max-width: 820px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
h1 { font-size: 20px; font-weight: 600; }
.sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
.state {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 28px; text-align: center; color: var(--text-muted);
}
.state .emoji { font-size: 32px; margin-bottom: 8px; }
.state.err { background: var(--error-bg); border-color: var(--error); color: var(--error); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; margin-bottom: 12px;
}
.card.undecidable { border-color: var(--amber); background: var(--amber-bg); }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.path {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 6px 8px; margin: 8px 0; word-break: break-all;
}
.meta { color: var(--text-muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 12px; }
.meta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
button {
  font: inherit; border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 16px; cursor: pointer; background: var(--surface); color: var(--text);
}
button:hover:not(:disabled) { background: var(--bg); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.approve { background: var(--green); border-color: var(--green); color: #fff; }
button.approve:hover:not(:disabled) { background: #26834d; }
button.reject { background: var(--surface); border-color: var(--error); color: var(--error); }
button.reject:hover:not(:disabled) { background: var(--error-bg); }
.note { font-size: 12px; color: var(--text-muted); }
.note.warn { color: var(--amber); }
.note.bad { color: var(--error); }
.badge {
  display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
}
.foot { margin-top: 20px; color: var(--text-light); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Approvaly</h1>
    <span class="badge" id="conn">načítám…</span>
  </header>
  <div class="sub">
    Rozhodnutí odsud platí stejně jako z telefonu — je to tatáž fronta a tatáž
    autorita. První odpověď vítězí.
  </div>

  <div id="list"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// Stav
//
// `queue` je null, dokud server jednou nepotvrdil. Rozdíl mezi `null` a `[]`
// je celý smysl téhle stránky: prázdné pole znamená "server řekl, že nic
// nečeká", null znamená "nevíme". Kreslit obojí stejně by z prvního selhání
// udělalo povolení odejít od počítače.
// ══════════════════════════════════════════════════════════════════════════
let queue = null;
let lastError = null;
// Hláška o posledním rozhodnutí **přežije obnovení fronty**.
//
// Byla dřív přilepená na položku (`item._notice`), jenže `refresh()` frontu
// nahradí novými objekty — a s nimi hlášku. Uživatel ji viděl řádově
// milisekundy. Jedna akce = jedna zpráva, drží se stranou od dat.
let notice = null;
let busy = new Set();
const POLL_MS = 3000;

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const text = await res.text();
  let parsed = null;
  try { parsed = text ? JSON.parse(text) : null; } catch { /* není JSON */ }
  return { ok: res.ok, status: res.status, body: parsed, raw: text };
}

async function refresh() {
  const res = await api('GET', '/api/approvals');
  if (!res.ok || !res.body || !Array.isArray(res.body.approvals)) {
    // Fronta se **nepřekresluje ze staré paměti**. Kdyby zůstala viset
    // poslední úspěšná odpověď, tvářila by se jako živá.
    lastError = res.body?.error || `HTTP ${res.status}`;
    queue = null;
  } else {
    lastError = null;
    queue = res.body.approvals;
  }
  render();
}

async function decide(item, decision) {
  if (busy.has(item.id)) return;
  busy.add(item.id);
  render();

  // Otisk je povinný a posílá se **ten, který přišel se záznamem** — tím se
  // prokazuje, že se rozhoduje o tom, co bylo na obrazovce. Když se payload
  // mezitím změnil, server to odmítne jako `approval_superseded`, a to je
  // správně: je to jiná otázka.
  const res = await api('POST', `/api/approvals/${encodeURIComponent(item.id)}/decide`, {
    decision,
    payloadFingerprint: item.payloadFingerprint,
  });

  busy.delete(item.id);

  if (res.ok && res.body?.replay) {
    notice = { kind: 'warn', text: decidedElsewhere(res.body) };
  } else if (!res.ok) {
    notice = { kind: 'bad', text: czRefusal(res.body?.reason, res.body?.error) };
  } else {
    notice = null;
  }
  render();
  refresh();
}

/**
 * Čtyři konce, ne dva.
 *
 * `invalidated` a `cancelled` **nejsou rozhodnutí člověka** — a věta to musí
 * říct, jinak si uživatel domyslí, že to někdo zamítl. Totéž rozlišení má
 * mobilní klient (`decidedElsewhereSentence` v `app.js`).
 */
function decidedElsewhere(body) {
  const who = body.decidedBy ? ` (${body.decidedBy})` : '';
  switch (body.state || body.decision) {
    case 'approve': return `Schváleno jinde${who}.`;
    case 'reject': return `Zamítnuto jinde${who}.`;
    case 'invalidated':
      return 'Propadlo, protože se změnil cíl. Nikdo to nezamítl — musí vzniknout nový požadavek.';
    case 'cancelled':
      return 'Zrušeno: běh, který se ptal, přestal čekat. Nikdo to nezamítl.';
    default: return 'Rozhodnuto jinde.';
  }
}

function czRefusal(reason, fallback) {
  return {
    approval_superseded: 'Obsah se od zobrazení změnil — je to jiná otázka. Načti frontu znovu.',
    approval_expired: 'Rozhodnutí už neplatí.',
    unbound_approval: 'Tenhle approval není navázaný na běh a operaci, takže nejde udělit.',
    not_found: 'Approval už neexistuje.',
    fingerprint_required: 'Chybí otisk obsahu — bez něj by to bylo rozhodnutí naslepo.',
    decision_invalid: 'Neplatné rozhodnutí.',
  }[reason] || fallback || 'Nepovedlo se rozhodnout.';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const list = document.getElementById('list');
  const conn = document.getElementById('conn');
  const foot = document.getElementById('foot');

  // Nad seznamem, ať je vidět i když rozhodnutý požadavek z fronty zmizel —
  // což je přesně ten případ, kdy uživatel nejvíc potřebuje vědět, co se stalo.
  const banner = notice
    ? `<div class="card"><div class="note ${notice.kind}">${esc(notice.text)}</div></div>`
    : '';

  if (queue === null) {
    conn.textContent = 'nedostupné';
    // Ani slovo o tom, že nic nečeká — nevíme to.
    list.innerHTML = banner + `<div class="state err">
      <div class="emoji">⚠️</div>
      <div><strong>Frontu se nepodařilo načíst.</strong></div>
      <div style="margin-top:6px">${esc(lastError)}</div>
      <div style="margin-top:6px;font-size:12px">
        Tohle <em>není</em> „nic nečeká" — čekat může cokoli a my to nevidíme.
      </div>
    </div>`;
    foot.textContent = '';
    return;
  }

  conn.textContent = 'připojeno';

  if (queue.length === 0) {
    list.innerHTML = banner + `<div class="state">
      <div class="emoji">✅</div>
      <div>Nic nečeká.</div>
    </div>`;
    foot.textContent = `Naposledy potvrzeno serverem ${new Date().toLocaleTimeString('cs-CZ')}.`;
    return;
  }

  list.innerHTML = banner + queue.map(item => {
    const working = busy.has(item.id);
    const undecidable = item.decidable === false;

    // `precondition` approval **nemá odpočet**. Odpočet u něj není informace,
    // je to mýlka: neplatí, dokud běží čas, ale dokud se nezmění cíl.
    const platnost = item.validity === 'precondition'
      ? 'platí, dokud se nezmění cíl'
      : `okno do ${esc(item.expiresAt)}${item.expired ? ' — propadlo' : ''}`;

    return `<div class="card ${undecidable ? 'undecidable' : ''}">
      <h2>${esc(item.title)}</h2>
      ${item.preconditionRef || item.detail
        ? `<div class="path">${esc(item.preconditionRef || item.detail)}</div>` : ''}
      <div class="meta">
        <span>běh <code>${esc(item.runId)}</code></span>
        <span>operace <code>${esc(item.operationRef)}</code></span>
        <span>${esc(platnost)}</span>
        <span>otisk <code>${esc(String(item.payloadFingerprint).slice(0, 12))}…</code></span>
      </div>
      ${undecidable ? `<div class="note warn" style="margin-top:8px">
        Tenhle požadavek <strong>nejde rozhodnout</strong> — není navázaný na běh
        a operaci. Neschováváme ho: fronta, která zamlčí čekající požadavek, dělá
        z „nic nečeká" nepravdu.
      </div>` : `<div class="actions">
        <button class="approve" ${working ? 'disabled' : ''}
                onclick="onDecide('${esc(item.id)}','approve')">Schválit</button>
        <button class="reject" ${working ? 'disabled' : ''}
                onclick="onDecide('${esc(item.id)}','reject')">Zamítnout</button>
        ${working ? '<span class="note">odesílám…</span>' : ''}
      </div>`}
    </div>`;
  }).join('');

  foot.textContent = `${queue.length} čeká · obnovuje se každé ${POLL_MS / 1000} s.`;
}

window.onDecide = function (id, decision) {
  const item = (queue || []).find(x => x.id === id);
  if (item) decide(item, decision);
};

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
