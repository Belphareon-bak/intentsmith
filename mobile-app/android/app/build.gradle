apply plugin: 'com.android.application'

def sourceRevision = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.get().trim()
if (!(sourceRevision ==~ /[a-f0-9]{40}/)) {
    throw new GradleException('Unable to resolve the 40-character source revision for the Android artifact.')
}

android {
    namespace "cz.intentsmith.companion"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cz.intentsmith.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [intentsmithSourceRevision: sourceRevision]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signing for an *internal* build.  The key is generated by
    // `npm run mobile:android:keystore` into `mobile-app/keys/`, which is
    // git-ignored: a signing key in the repository is a signing key everybody
    // has, and an APK signed with it cannot mean "we built this".
    //
    // Without that file release packaging fails. A debug-signed throwaway is
    // possible only with the explicit `-PallowDebugSigning=true` escape below.
    signingConfigs {
        internal {
            def props = new Properties()
            def file = rootProject.file('keystore.properties')
            if (file.exists()) {
                props.load(new FileInputStream(file))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    // `BuildConfig.DEBUG` is how the capture escape in MainActivity is kept out
    // of release builds; AGP 8 stops generating BuildConfig unless asked.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Fail-closed.  The earlier version fell back to the debug key so
            // that `assembleRelease` always produced *something* — which meant
            // an APK whose signature said "debug" could be handed round as the
            // internal build, and nobody would notice until it refused to
            // upgrade over the real one.  A build that cannot sign correctly
            // now stops and says which key is missing.
            //
            // `-PallowDebugSigning=true` is the deliberate escape for someone
            // who genuinely wants a throwaway; it has to be typed, and it is
            // visible in the build log.
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.internal
            } else if (project.hasProperty('allowDebugSigning')
                       && project.property('allowDebugSigning').toString() == 'true') {
                logger.warn('IntentSmith: signing the RELEASE build with the DEBUG key (allowDebugSigning=true)')
                signingConfig signingConfigs.debug
            }
        }
    }
}

// Enforce signing only when a release package is actually requested. Throwing
// while Gradle evaluates the build file also breaks debug tests and lint, which
// do not produce a distributable artifact.
gradle.taskGraph.whenReady { graph ->
    def packagesRelease = graph.allTasks.any { task ->
        task.project == project && (
            task.name == 'assembleRelease'
            || task.name == 'bundleRelease'
            || task.name.startsWith('packageRelease')
        )
    }
    def debugSigningAllowed = project.hasProperty('allowDebugSigning')
        && project.property('allowDebugSigning').toString() == 'true'
    if (packagesRelease && !rootProject.file('keystore.properties').exists() && !debugSigningAllowed) {
        throw new GradleException(
            'Release build has no signing key. Run `npm run mobile:android:keystore` first, '
            + 'or pass -PallowDebugSigning=true to build a labelled throwaway artifact.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // MD-11 / I-6: LockPolicy + KeystoreStorage use AndroidKeyStore directly.
    // AndroidX security-crypto is deliberately absent: its APIs are deprecated
    // and the application owns the small AES-GCM envelope it needs.
    // MR-23 / P-4: the lock is the *system* credential where the device has
    // one.  A screen lock the user already trusts beats a PIN this app would
    // have to store, rate-limit and get right on its own.
    implementation "androidx.biometric:biometric:1.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
