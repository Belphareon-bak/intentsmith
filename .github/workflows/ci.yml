name: IntentSmith development checks

on:
  pull_request:
  push:
    branches: [main, 'integration/main-reconcile-*', 'work/real-chat-journeys-20260930', 'work/chat-quality-20261001']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intentsmith-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    name: Development checks (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Studio workspace dependencies
        working-directory: intentsmith-ide
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --ignore-scripts
          yarn prepare:protocol
      - name: Validate registry and module boundaries
        run: |
          node scripts/validate-test-registry.js
          node scripts/module-boundary-ratchet.mjs
      - name: Verify generated Studio view
        run: node intentsmith-ide/extensions/intentsmith-studio2/scripts/build-view.js --check
      - name: Verify privacy at the HTTP boundary
        run: node --test tests/chat-memory-privacy.test.js tests/chat-privacy-http.test.js tests/m5-privacy-remediation.test.js
      - name: Install chat and M2 isolation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 nftables util-linux apparmor
      - name: Prepare Ubuntu namespace policy for M2 sandbox tests
        run: |
          cat /sys/module/apparmor/parameters/enabled
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          test ! -e /etc/apparmor.d/intentsmith-bwrap-ci
          sudo install --mode=0644 /dev/stdin /etc/apparmor.d/intentsmith-bwrap-ci <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile intentsmith-bwrap-ci /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/intentsmith-bwrap-ci
          /usr/bin/bwrap --unshare-all --unshare-user --disable-userns --cap-drop ALL \
            --ro-bind /usr /usr --symlink usr/bin /bin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 --dev /dev --proc /proc \
            --tmpfs /tmp -- /usr/bin/true
      - name: Verify chat context and approved effects (offline)
        run: >-
          node scripts/nightly-audit.js
          --run-id=ci-chat-${{ github.run_id }}-${{ github.run_attempt }}
          --suite=IS-T1-TESTS-CHAT-CONTEXT-INTERPRETATION-TEST,IS-T3-TESTS-CHAT-LITERAL-WRITE-HTTP-TEST,IS-T3-TESTS-CHAT-REPEAT-SAVE-HTTP-TEST,IS-T1-TESTS-CHAT-RESILIENCE-RUNNER-CONTRACT-TEST,IS-T3-TESTS-CRE-BUILD-ARBITRATION-TEST,IS-T2-TESTS-M1-CHAT-CONTRACT-TEST,IS-T1-TESTS-MODULE-BOUNDARY-RATCHET-TEST
          --concurrency=1
          --allow-blocker=toolchain:bubblewrap,toolchain:bwrap,toolchain:git,toolchain:prlimit
      - name: Verify functional M2 application controls (offline)
        run: >-
          node scripts/nightly-audit.js
          --run-id=ci-code-${{ github.run_id }}-${{ github.run_attempt }}
          --suite=IS-T1-TESTS-PROJECT-APP-ACCEPTANCE-TEST,IS-T1-TESTS-PROJECT-APP-M2-FUNCTIONAL-TEST,IS-T1-TESTS-M2-GOVERNANCE-EVALUATOR-TEST,IS-T1-TESTS-M2-LIFECYCLE-APPLICATION-SERVICE-TEST,IS-T1-TESTS-M1-MODEL-CONTRACT-TEST,IS-T1-TESTS-MODEL-CTX-TEST,IS-T1-TESTS-PROJECT-COLLABORATION-TEST,IS-T1-TESTS-M2-PRIVATE-HTTP-CONTRACT-TEST,IS-T1-TESTS-M2-PRIVATE-HTTP-STARTUP-TEST,IS-T1-TESTS-M2-LIFECYCLE-STUDIO-SURFACE-TEST,IS-T1-TESTS-M2-EXECUTION-PROCESS-SUPERVISION-TEST,IS-T1-TESTS-PROJECT-WELCOME-TEST
          --concurrency=1
          --allow-blocker=toolchain:bwrap,toolchain:git,toolchain:prlimit,toolchain:iproute2,toolchain:nftables
      - name: Preserve chat and M2 audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-audits-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .intentsmith-artifacts/test-runs/ci-chat-*/report.json
            .intentsmith-artifacts/test-runs/ci-chat-*/checkpoint.json
            .intentsmith-artifacts/test-runs/ci-chat-*/inventory.json
            .intentsmith-artifacts/test-runs/ci-chat-*/logs/*.log
            .intentsmith-artifacts/test-runs/ci-code-*/report.json
            .intentsmith-artifacts/test-runs/ci-code-*/checkpoint.json
            .intentsmith-artifacts/test-runs/ci-code-*/inventory.json
            .intentsmith-artifacts/test-runs/ci-code-*/logs/*.log
          if-no-files-found: error
      - name: Verify Studio 2 stores, rendering and authority adapters
        run: |
          for test_file in tests/studio2-*.test.js; do
            node "$test_file"
          done
      - name: Verify source hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

# This is the development subset named above, not the complete deterministic
# profile or a release gate. The exact d7 full-profile failures and blockers
# remain in its report; no verdict is reclassified by this workflow.
