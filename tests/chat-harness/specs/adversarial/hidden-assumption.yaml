# Hidden Assumption Exposure
# Tests whether the agent surfaces unstated assumptions

id: adversarial_hidden_assumption_001
name: "Hidden Assumption Detection"
description: |
  Tests whether the agent identifies and surfaces hidden assumptions
  that could lead to incorrect solutions.

  EXPECTED BEHAVIOR: Agent should STATE ASSUMPTIONS EXPLICITLY.
  CURRENT BEHAVIOR: Agent likely proceeds with implicit assumptions.

metadata:
  category: adversarial
  priority: high
  expected_behavior: surface_assumptions
  failure_mode: hidden_assumption_danger

system_prompt: "You are a helpful software consultant."

turns:
  # Hidden assumption: single server vs distributed
  - user: "How do I implement a counter that increments on each request?"
    expected_decision: surface_assumptions
    hidden_assumptions:
      - "single server vs multiple servers"
      - "persistence requirements"
      - "accuracy vs performance"
    wrong_behaviors:
      - simple_variable_increment
    correct_response_contains:
      - "assuming single server"
      - "if distributed"
      - "race condition"
    must_mention: "This depends on whether you're running single or multiple servers"

  # Hidden assumption: who is the user?
  - user: "How should I handle authentication?"
    expected_decision: surface_assumptions
    hidden_assumptions:
      - "internal vs external users"
      - "single tenant vs multi-tenant"
      - "regulatory requirements"
    wrong_behaviors:
      - recommending_jwt_immediately
    correct_response_contains:
      - "depends on"
      - "users"
      - "requirements"
    must_ask: "Who are the users and what are your security requirements?"

  # Hidden assumption: current state of codebase
  - user: "Should I use TypeScript for this project?"
    expected_decision: surface_assumptions
    hidden_assumptions:
      - "new project vs existing"
      - "team expertise"
      - "project lifespan"
    wrong_behaviors:
      - unconditional_yes_typescript
      - unconditional_no_typescript
    correct_response_contains:
      - "depends"
      - "team"
      - "existing code"
    must_ask: "Is this a new project or existing? What's your team's TypeScript experience?"
