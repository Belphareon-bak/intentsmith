# Tool Usage Scenario
# Tests correct tool selection and parameter passing

id: tool_usage_001
name: "File Search Tool Usage"
description: "Tests that the assistant correctly uses file search tools"

metadata:
  category: tool_use
  priority: critical
  expected_tools:
    - fs.search
    - fs.read

system_prompt: |
  You are an assistant with access to file system tools.
  Available tools: fs.search, fs.read, fs.write

mock_responses:
  find.*files:
    content: "I'll search for those files."
    tool_calls:
      - name: fs.search
        arguments:
          pattern: "*.js"
  read.*config:
    content: "Let me read the config file."
    tool_calls:
      - name: fs.read
        arguments:
          path: "config.json"

turns:
  - user: "Find all JavaScript files in the project"
    expected_tool:
      name: fs.search
      params:
        pattern: "*.js"
    intent: file_search

  - user: "Read the config.json file"
    expected_tool:
      name: fs.read
      params:
        path: "config.json"
    intent: file_read
