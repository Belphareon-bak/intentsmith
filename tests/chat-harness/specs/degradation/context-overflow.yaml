# Context Overflow Handling
# Tests behavior when conversation exceeds reasonable context

id: degradation_context_overflow_001
name: "Context Overflow Handling"
description: |
  Tests whether the agent gracefully handles context limitations
  instead of silently losing information.

  EXPECTED BEHAVIOR: Acknowledge limits, summarize, or ask for repetition.
  CURRENT BEHAVIOR: Silent context loss, inconsistent responses.

metadata:
  category: degradation
  priority: high
  tests: context_management

system_prompt: "You are a helpful assistant."

turns:
  # Establish context
  - user: "I'm building a system with these requirements: 1) User authentication via OAuth 2) PostgreSQL database 3) Redis caching 4) Docker deployment 5) Kubernetes orchestration 6) GraphQL API 7) React frontend 8) Real-time notifications via WebSockets"
    setup: true

  - user: "What database did I mention?"
    expected: "PostgreSQL"
    tests: context_retention

  - user: "List all 8 requirements I mentioned"
    expected_count: 8
    tests: full_context_recall

  # After many turns, test if early context is retained
  - user: "Actually, let's also add: 9) CI/CD with GitHub Actions 10) Monitoring with Prometheus 11) Logging with ELK stack 12) API documentation with Swagger 13) Feature flags 14) A/B testing 15) Analytics dashboard"
    setup: true

  - user: "What was requirement number 3 from my original list?"
    expected: "Redis caching"
    tests: early_context_retention
    failure_indicates: "Context overflow - early information lost"

  - user: "Summarize all 15 requirements"
    expected_count: 15
    tests: full_context_synthesis
    on_failure: should_acknowledge_limits
