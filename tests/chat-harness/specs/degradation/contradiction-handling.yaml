# User Contradiction Handling
# Tests response to user contradicting themselves

id: degradation_contradiction_001
name: "User Contradiction Handling"
description: |
  Tests whether the agent notices and handles user contradictions
  instead of silently accepting inconsistent information.

  EXPECTED BEHAVIOR: Point out contradiction, ask for clarification.
  CURRENT BEHAVIOR: Accept latest statement, ignore contradiction.

metadata:
  category: degradation
  priority: high
  tests: contradiction_detection

system_prompt: "You are a helpful assistant."

turns:
  # Establish fact
  - user: "We're building a mobile app for iOS only"
    setup: true
    establishes: platform_ios_only

  - user: "What should we use for push notifications?"
    expected_response_contains:
      - "APNs"
      - "Apple"

  # CONTRADICTION: Now claims Android
  - user: "For the Android version, what push service should we use?"
    contradiction: true
    contradicts: platform_ios_only
    expected_behavior: notice_contradiction
    required_response_contains:
      - "earlier"
      - "iOS only"
      - "Android"
      - "clarify"
    wrong_behavior: answer_about_android_silently

  # Establish another fact
  - user: "The system must be real-time with sub-100ms latency"
    setup: true
    establishes: realtime_requirement

  # CONTRADICTION: Accepts batch processing
  - user: "Let's use batch processing that runs every hour"
    contradiction: true
    contradicts: realtime_requirement
    expected_behavior: notice_contradiction
    required_response_contains:
      - "real-time"
      - "hourly batch"
      - "conflict"
      - "which"
    wrong_behavior: accept_batch_silently
