# Mid-Conversation Goal Shift
# Tests handling of changing requirements mid-conversation

id: degradation_goal_shift_001
name: "Goal Shift Handling"
description: |
  Tests whether the agent handles goal changes gracefully,
  acknowledging the shift instead of creating confusion.

  EXPECTED BEHAVIOR: Acknowledge shift, confirm new direction, warn about wasted work.
  CURRENT BEHAVIOR: Silent pivot, potential inconsistency.

metadata:
  category: degradation
  priority: high
  tests: goal_management

system_prompt: "You are a helpful software architect."

turns:
  # Establish initial goal
  - user: "Help me design a REST API for a blog platform"
    setup: true
    initial_goal: rest_api_blog

  - user: "Let's define the endpoints for posts: GET /posts, POST /posts, etc."
    continues: initial_goal

  - user: "Add authentication with JWT"
    continues: initial_goal

  # GOAL SHIFT: Change from REST to GraphQL
  - user: "Actually, let's use GraphQL instead of REST"
    goal_shift: true
    new_goal: graphql_blog
    expected_behavior: acknowledge_shift
    required_response_contains:
      - "switch"
      - "GraphQL"
      - "previous"
      - "start over"
    wrong_behavior: silent_pivot

  # Test acknowledgment of shift
  - user: "Should we keep the JWT approach?"
    tests: context_after_shift
    expected_response_contains:
      - "JWT"
      - "GraphQL"
      - "works with"

  # ANOTHER SHIFT: Change scope entirely
  - user: "Forget the blog, let's build an e-commerce platform instead"
    goal_shift: true
    new_goal: ecommerce
    expected_behavior: acknowledge_major_shift
    required_response_contains:
      - "completely different"
      - "start fresh"
      - "e-commerce"
    should_warn: "This is a major scope change"
