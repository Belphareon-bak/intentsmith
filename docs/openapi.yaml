openapi: 3.1.0
info:
  title: C.3 Agent API
  version: 47.0.0
  description: |
    REST + SSE API for the C.3 Agent headless daemon (agentd).

    Provides endpoints for:
    - Plan execution (sync and streaming)
    - Plan status queries
    - Health and metrics
    - Audit trail export

servers:
  - url: http://localhost:3336
    description: Local development

tags:
  - name: execution
    description: Plan execution endpoints
  - name: plans
    description: Plan management
  - name: monitoring
    description: Health and metrics
  - name: audit
    description: Audit trail export

paths:
  /ask:
    post:
      tags: [execution]
      summary: Execute a plan synchronously
      description: |
        Executes the Golden Path pipeline for the given input.
        Returns the complete result when execution finishes.
      operationId: executeSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              simple:
                summary: Simple request
                value:
                  input: "Search for RTX 5090 prices"
              with_options:
                summary: With options
                value:
                  input: "Find weather in Prague"
                  options:
                    autoApprove: true
                    context:
                      user_id: "user-123"
      responses:
        '200':
          description: Execution completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ask_stream:
    post:
      tags: [execution]
      summary: Execute a plan with SSE streaming
      description: |
        Executes the Golden Path pipeline with real-time event streaming.
        Events are sent as Server-Sent Events (SSE).
      operationId: executeStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of SSE events:
                  - plan_started: Plan execution begun
                  - plan_created: Plan structure available
                  - step_completed: Individual step finished
                  - plan_completed: Execution finished
                  - plan_error: Execution failed
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plans/{plan_id}:
    get:
      tags: [plans]
      summary: Get plan status
      description: Returns the current status and results of a plan.
      operationId: getPlan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
          description: Plan UUID
      responses:
        '200':
          description: Plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanStatus'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plans/{plan_id}/events:
    get:
      tags: [plans]
      summary: Subscribe to plan events
      description: |
        Opens an SSE connection to receive events for a specific plan.
        Historical events are sent first, then live events.
      operationId: getPlanEvents
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
          description: Plan UUID
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags: [monitoring]
      summary: Health check
      description: Returns the health status of the agent daemon.
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /metrics:
    get:
      tags: [monitoring]
      summary: Get metrics
      description: Returns operational metrics for monitoring.
      operationId: getMetrics
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'

  /audit/export:
    get:
      tags: [audit]
      summary: Export audit trail
      description: Export audit events in JSON or CSV format.
      operationId: exportAudit
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: Export format
        - name: plan_id
          in: query
          schema:
            type: string
          description: Filter by plan ID
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action type
        - name: since
          in: query
          schema:
            type: integer
          description: Filter events after this timestamp (ms)
        - name: until
          in: query
          schema:
            type: integer
          description: Filter events before this timestamp (ms)
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
            maximum: 10000
          description: Maximum events to return
      responses:
        '200':
          description: Audit export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExport'
            text/csv:
              schema:
                type: string

  /audit/plans/{plan_id}/timeline:
    get:
      tags: [audit]
      summary: Get plan execution timeline
      description: Returns a timeline view of all events for a specific plan.
      operationId: getPlanTimeline
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanTimeline'

components:
  schemas:
    AskRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          description: Natural language input describing the goal
          minLength: 1
          example: "Search for RTX 5090 prices"
        options:
          type: object
          properties:
            autoApprove:
              type: boolean
              default: true
              description: Auto-approve plan execution without human gate
            context:
              type: object
              description: Additional context to pass to execution

    ExecutionResult:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed, partial]
        plan:
          $ref: '#/components/schemas/PlannerOutput'
        execution:
          $ref: '#/components/schemas/ExecutionOutput'
        duration_ms:
          type: integer
        error:
          type: string

    PlannerOutput:
      type: object
      required:
        - plan_id
        - goal
        - steps
        - requires_approval
        - confidence
      properties:
        plan_id:
          type: string
          format: uuid
        goal:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        requires_approval:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1

    Step:
      type: object
      required:
        - id
        - tool
        - params
      properties:
        id:
          type: string
        tool:
          type: string
          pattern: '^[a-z][a-z0-9]*\.[a-z][a-z0-9]*$'
        params:
          type: object
        dependsOn:
          type: array
          items:
            type: string

    ExecutionOutput:
      type: object
      properties:
        plan_id:
          type: string
        status:
          type: string
          enum: [completed, partial, failed]
        step_results:
          type: array
          items:
            $ref: '#/components/schemas/StepResult'
        total_duration_ms:
          type: integer

    StepResult:
      type: object
      properties:
        step_id:
          type: string
        ok:
          type: boolean
        data:
          type: object
        error:
          type: string
        duration_ms:
          type: integer

    PlanStatus:
      type: object
      properties:
        plan_id:
          type: string
        status:
          type: string
          enum: [running, completed, failed, gated, paused]
        input:
          type: string
        plan:
          $ref: '#/components/schemas/PlannerOutput'
        execution:
          $ref: '#/components/schemas/ExecutionOutput'
        error:
          type: string
        created_at:
          type: integer
        completed_at:
          type: integer

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        version:
          type: string
        uptime_ms:
          type: integer

    Metrics:
      type: object
      properties:
        uptime_ms:
          type: integer
        requests_total:
          type: integer
        plans_created:
          type: integer
        plans_completed:
          type: integer
        plans_failed:
          type: integer
        plans_pending:
          type: integer
        success_rate_percent:
          type: number
        active_sse_connections:
          type: integer

    AuditExport:
      type: object
      properties:
        metadata:
          type: object
          properties:
            exported_at:
              type: string
              format: date-time
            total_events:
              type: integer
            filters:
              type: object
            version:
              type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'

    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        plan_id:
          type: string
        timestamp:
          type: integer
        timestamp_iso:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
          enum:
            - PLAN_STARTED
            - PLAN_COMPLETED
            - PLAN_FAILED
            - STEP_STARTED
            - STEP_COMPLETED
            - TOOL_CALLED
            - GATE_REQUESTED
            - GATE_APPROVED
        payload_hash:
          type: string
        payload:
          type: object

    PlanTimeline:
      type: object
      properties:
        plan_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_ms:
          type: integer
        event_count:
          type: integer
        timeline:
          type: array
          items:
            type: object
            properties:
              sequence:
                type: integer
              action:
                type: string
              actor:
                type: string
              timestamp_iso:
                type: string
              elapsed_ms:
                type: integer
              payload_summary:
                type: object

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        plan_id:
          type: string
